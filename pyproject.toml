[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaku"
version = "0.1.0a1"
description = "IDLEより少し高機能なテキストエディター"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.11.0",
    "ruff>=0.15.9",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "ty>=0.0.29",
]

[project.gui-scripts]
kaku = "kaku.__main__:main"

[tool.hatch.build.targets.wheel]
exclude = ["uv.lock", "CLAUDE.md", ".gitignore"]
